[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-engine-cli"
version = "1.0.0"
description = "Development CLI for the Physics Engine project"
requires-python = ">=3.8"

[project.scripts]
engine = "tools.engine:main"

[tool.setuptools]
packages = ["tools"]